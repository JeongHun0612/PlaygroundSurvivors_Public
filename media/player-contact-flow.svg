<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="350" viewBox="0 0 1000 350" role="img" aria-labelledby="title description">
  <title id="title">플레이어 통과 방지와 접촉 피해의 구현 흐름</title>
  <desc id="description">통과 방지는 주변 대상 조회, 높이와 XZ 거리 검사, 접근 방향 속도 성분 제거, 수정 속도 적용 순서입니다. 접촉 피해는 몬스터 관리 루프에서 3D 거리와 쿨타임을 확인하고 체력을 갱신하며, 생존 시 피격 점멸을 재생합니다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#6e7781"/>
    </marker>
  </defs>
  <style>
    text { fill: #1f2328; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif; text-anchor: middle; }
    .lane { font-size: 20px; font-weight: 600; text-anchor: start; }
    .heading { font-size: 17px; font-weight: 600; }
    .detail { font-size: 15px; }
    .block { fill: #f0f6ff; stroke: #b6d3f5; stroke-width: 1.5; }
    .damage { fill: #f0f9f2; stroke: #b4d9bf; stroke-width: 1.5; }
    .edge { fill: none; stroke: #6e7781; stroke-width: 1.7; marker-end: url(#arrow); }
  </style>
  <text class="lane" x="24" y="36" style="fill:#0969da">통과 방지 · 이동 속도 보정</text>
  <path class="edge" d="M 238 108 H 270"/>
  <path class="edge" d="M 484 108 H 516"/>
  <path class="edge" d="M 730 108 H 762"/>
  <g>
    <rect class="block" x="24" y="64" width="214" height="88" rx="7"/>
    <text class="heading" x="131" y="101">주변 대상 조회</text>
    <text class="detail" x="131" y="127">그리드 + BlockableRegistry</text>
  </g>
  <g>
    <rect class="block" x="270" y="64" width="214" height="88" rx="7"/>
    <text class="heading" x="377" y="101">높이·XZ 거리 검사</text>
    <text class="detail" x="377" y="127">차단 범위 안인지 확인</text>
  </g>
  <g>
    <rect class="block" x="516" y="64" width="214" height="88" rx="7"/>
    <text class="heading" x="623" y="101">접근 방향 성분 제거</text>
    <text class="detail" x="623" y="127">대상 쪽으로 움직일 때만</text>
  </g>
  <g>
    <rect class="block" x="762" y="64" width="214" height="88" rx="7"/>
    <text class="heading" x="869" y="101">수정 속도 적용</text>
    <text class="detail" x="869" y="127">접선 방향 이동은 유지</text>
  </g>
  <text class="lane" x="24" y="206" style="fill:#1a7f37">접촉 피해 · 거리와 쿨타임으로 판정</text>
  <path class="edge" d="M 238 278 H 270"/>
  <path class="edge" d="M 484 278 H 516"/>
  <path class="edge" d="M 730 278 H 762"/>
  <g>
    <rect class="damage" x="24" y="234" width="214" height="88" rx="7"/>
    <text class="heading" x="131" y="271">ManagedUpdate</text>
    <text class="detail" x="131" y="297">몬스터 관리 루프</text>
  </g>
  <g>
    <rect class="damage" x="270" y="234" width="214" height="88" rx="7"/>
    <text class="heading" x="377" y="271">3D 거리·쿨타임 확인</text>
    <text class="detail" x="377" y="297">접촉 범위 + 쿨타임 종료</text>
  </g>
  <g>
    <rect class="damage" x="516" y="234" width="214" height="88" rx="7"/>
    <text class="heading" x="623" y="271">체력 갱신</text>
    <text class="detail" x="623" y="297">TakeDamage</text>
  </g>
  <g>
    <rect class="damage" x="762" y="234" width="214" height="88" rx="7"/>
    <text class="heading" x="869" y="271">피격 점멸</text>
    <text class="detail" x="869" y="297">생존 시 HitFlashEffect</text>
  </g>
</svg>
